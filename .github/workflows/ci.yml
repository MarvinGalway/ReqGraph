name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/reqgraph-dev
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -O /dev/null http://localhost:7474 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_PASSWORD: reqgraph-dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install reqgraph with dev + optional extras
        run: pip install -e ".[dev,embeddings,js]"

      - name: ruff
        run: ruff check reqgraph tests

      - name: mypy
        run: mypy reqgraph --ignore-missing-imports

      - name: pytest (unit + integration, excludes live_api)
        run: pytest -m "not live_api"
